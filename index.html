<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Easy Design 2.0</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #fafafa;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 480px;
      padding: 32px 24px;
      text-align: center;
    }

    h1 {
      margin-bottom: 12px;
    }

    p {
      line-height: 1.5;
    }
  </style>
</head>

<body>

  <main class="app">
    <h1>Easy Design 2.0 🍓</h1>

    <p id="hello">
      Загружаем твой трекер...
    </p>
  </main>

  <script>
    const tg = window.Telegram?.WebApp;

    if (tg) {
      tg.ready();
      tg.expand();

      const user = tg.initDataUnsafe?.user;

      if (user?.first_name) {
        document.getElementById("hello").textContent =
          `Привет, ${user.first_name}! Твой трекер почти готов 💗`;
      } else {
        document.getElementById("hello").textContent =
          "Привет! Твой трекер почти готов 💗";
      }
    }
  </script>

</body>
</html>
